# Stage 1: triplet-chain SFT with the bridge loss, Qwen2.5-VL-3B, single A100 80GB. 8,800 chains, 1 epoch.
model: Qwen/Qwen2.5-VL-3B-Instruct
data_file: sft_subset.jsonl       # from cs-frames
n_frames: 16
epochs: 1
grad_accum: 8                     # effective batch 8 examples -> 1,100 optimizer steps
lr: 1.0e-4                        # LoRA
warmup: 30
max_grad_norm: 1.0
bridge_weight: 0.2                # lambda in L_SFT = NLL + lambda * L_bridge; starts ~4.4 vs NLL ~1.4 on the base model, so kept moderate
bridge_prob: 0.5                  # fraction of examples that also get the bridge term (second forward pass)
save_every: 100
log_every: 5
seed: 0
dtype: bfloat16
attn: sdpa
gradient_checkpointing: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
