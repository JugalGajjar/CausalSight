# Mixed-data experiment, SFT arm 'real_chains'. Same recipe as configs/stage1_sft.yaml; data from cs-mix.
model: Qwen/Qwen2.5-VL-3B-Instruct
data_file: /content/drive/MyDrive/causalsight/mix/real_chains_sft.jsonl
n_frames: 16
epochs: 1
grad_accum: 8
lr: 0.0001
warmup: 30
max_grad_norm: 1.0
bridge_weight: 0.2
bridge_prob: 0.5
save_every: 100
log_every: 5
seed: 0
dtype: bfloat16
attn: sdpa
gradient_checkpointing: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
