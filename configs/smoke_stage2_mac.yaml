model: Qwen/Qwen2.5-VL-3B-Instruct
init_adapter: runs/stage1/adapter
data_file: rl_subset_chains.jsonl
prompt_style: chain
instr_in_user: true
n_frames: 4
group_size: 2
micro_batch: 1
max_new_tokens: 640
temperature: 1.0
lr: 1.0e-5
kl_beta: 0.04
kl_log_ratio_clip: 5.0
max_grad_norm: 1.0
steps: 2
save_every: 2
log_every: 1
seed: 0
dtype: float32
attn: sdpa
gradient_checkpointing: false
lora:
  r: 8
  alpha: 16
  dropout: 0.0
  targets: [q_proj, v_proj]
rewards:
  outcome: 1.0
  format_chain: 0.5
  grounding: 0.5
  necessity: 0.5
  process: 0.5
necessity:
  delta: 0.1
  eps: 0.02
  gamma: 0.5
