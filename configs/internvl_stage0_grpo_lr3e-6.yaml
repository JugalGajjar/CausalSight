# InternVL3-2B Stage 0 rerun: lr 3e-6 (the Qwen recipe's 1e-5 diverged on this base: KL 11 -> 58, reward fell).
model: OpenGVLab/InternVL3-2B-hf
data_file: rl_subset.jsonl
prompt_style: plain
instr_in_user: true
n_frames: 16
group_size: 8
micro_batch: 8
max_new_tokens: 256
temperature: 1.0
lr: 3.0e-06
kl_beta: 0.04
kl_log_ratio_clip: 5.0
max_grad_norm: 1.0
steps: 1500
save_every: 50
log_every: 1
seed: 0
dtype: bfloat16
attn: sdpa
gradient_checkpointing: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
rewards:
  outcome_lenient: 1.0
  format: 0.5
