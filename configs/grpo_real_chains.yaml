# Mixed-data experiment, RL arm 'real_chains': chain GRPO (outcome + format) from its SFT adapter.
model: Qwen/Qwen2.5-VL-3B-Instruct
init_adapter: /content/drive/MyDrive/causalsight/runs/sft_real_chains/adapter
data_file: /content/drive/MyDrive/causalsight/mix/real_rl.jsonl
prompt_style: chain
instr_in_user: true
n_frames: 16
group_size: 8
micro_batch: 8
max_new_tokens: 640
temperature: 1.0
lr: 1.0e-05
kl_beta: 0.04
kl_log_ratio_clip: 5.0
max_grad_norm: 1.0
steps: 1000
save_every: 50
log_every: 1
seed: 0
dtype: bfloat16
attn: sdpa
gradient_checkpointing: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
rewards:
  outcome: 1.0
  format_chain: 0.5
necessity_frames: 8
necessity:
  delta: 0.1
  eps: 0.02
  gamma: 0.5
