# InternVL3-2B, Stage 2: chain GRPO (outcome + format) from the InternVL Stage 1 adapter.
model: OpenGVLab/InternVL3-2B-hf
init_adapter: /content/drive/MyDrive/causalsight/runs/internvl_stage1/adapter
data_file: /content/CausalSight/data/subsets/rl_balanced_1500_options.jsonl
prompt_style: chain
instr_in_user: true
n_frames: 16
group_size: 8
micro_batch: 8
max_new_tokens: 640
temperature: 1.0
lr: 1.0e-05
kl_beta: 0.04
kl_log_ratio_clip: 5.0
max_grad_norm: 1.0
steps: 1000
save_every: 50
log_every: 1
seed: 0
dtype: bfloat16
attn: sdpa
gradient_checkpointing: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
rewards:
  outcome: 1.0
  format_chain: 0.5
necessity_frames: 8
necessity:
  delta: 0.1
  eps: 0.02
  gamma: 0.5
